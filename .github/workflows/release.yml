name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject version from tag
        run: |
          TAG=${GITHUB_REF_NAME}
          VERSION=${TAG#v}
          sed -i "s/__version__ = .*/__version__ = \"$VERSION\"/" src/version.py

      - name: Commit version back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/version.py
          git commit -m "chore: set version to ${GITHUB_REF_NAME#v} [skip ci]"
          git push origin HEAD:main
          git tag -f ${GITHUB_REF_NAME}
          git push origin ${GITHUB_REF_NAME} --force

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: SeqVista ${{ github.ref_name }}
          generateReleaseNotes: true
