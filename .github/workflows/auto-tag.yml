name: Auto Tag and Release

on:
  push:
    branches:
      - main

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: false
          release_branches: main

      - name: Update and commit version.py
        if: steps.tag.outputs.new_tag != ''
        run: |
          VERSION=${TAG#v}
          sed -i "s/__version__ = .*/__version__ = \"$VERSION\"/" src/version.py
          git config user.name "${{ github.event.head_commit.author.name }}"
          git config user.email "${{ github.event.head_commit.author.email }}"
          git add src/version.py
          git commit -m "chore: sync version.py to ${{ steps.tag.outputs.new_tag }} [skip ci]"
          git push origin HEAD:main
        env:
          TAG: ${{ steps.tag.outputs.new_tag }}

      - name: Create GitHub Release
        if: steps.tag.outputs.new_tag != ''
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag.outputs.new_tag }}
          name: SeqVista ${{ steps.tag.outputs.new_tag }}
          generateReleaseNotes: true